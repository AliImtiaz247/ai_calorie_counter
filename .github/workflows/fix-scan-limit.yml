name: Fix scan limit UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix hard-coded scan limit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/scan/presentation/scan_food_screen.dart')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Daily scan limit reached (5/5). Scans will reset at 12:00 AM.':
                  'Daily scan limit reached. Scans will reset at 12:00 AM.',
              'Daily 5-scan limit reached. Resets at 12:00 AM local time.':
                  'Daily scan limit reached. Resets at 12:00 AM local time.',
              'ScanUsage(limit: 5, used: 0, remaining: 5)':
                  'ScanUsage(limit: 4, used: 0, remaining: 4)',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/scan/presentation/scan_food_screen.dart .github/workflows/fix-scan-limit.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: synchronize scan limit UI with 4 scans per day'
          git rm .github/workflows/fix-scan-limit.yml
          git commit -m 'chore: remove temporary scan limit workflow'
          git push
